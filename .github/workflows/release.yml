name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-X main.buildVersion=${VERSION} -s -w"
          for GOOS in darwin linux; do
            for GOARCH in amd64 arm64; do
              NAME="oinc-${GOOS}-${GOARCH}"
              echo "building ${NAME}"
              GOOS=${GOOS} GOARCH=${GOARCH} go build -ldflags="${LDFLAGS}" -o "dist/${NAME}" ./cmd/oinc
            done
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" &>/dev/null; then
            echo "::error::Release $tag already exists; published releases must not be overwritten"
            exit 1
          fi
          gh release create "$tag" dist/* \
            --draft \
            --verify-tag \
            --title "$tag" \
            --generate-notes
          gh release edit "$tag" --draft=false
